<!doctype html>
<html lang="en" data-sg-theme="shadow">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Genesis UI — Minimal Consumer</title>
    <link rel="stylesheet" href="../dist/genesis-ui.css">
    <script type="module" src="../dist/genesis-ui.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: grid;
            margin: 0;
            background: transparent;
            font-family: var(--sg-font-body);
            place-items: center;
        }

        .example-shell {
            width: min(420px, calc(100vw - 32px));
        }

        .example-shell p {
            color: var(--sg-color-text-secondary);
            line-height: 1.6;
        }

        .example-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        output {
            display: block;
            min-height: 20px;
            margin-top: 16px;
            color: var(--sg-color-cyan);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <sg-panel class="example-shell">
        <p class="sg-overline">No-build consumer</p>
        <h1 class="sg-heading sg-heading--2">Shadow Glass is loaded</h1>
        <p>This page uses only the compiled CSS, JavaScript module, standard HTML, and a DOM event listener.</p>
        <sg-alert tone="success">No framework or remote runtime dependency was loaded.</sg-alert>
        <div class="example-actions">
            <sg-button id="confirm" variant="primary">Confirm</sg-button>
            <sg-button variant="ghost">Cancel</sg-button>
        </div>
        <output id="result" aria-live="polite">Waiting for sg-activate.</output>
    </sg-panel>

    <script>
        document.querySelector('#confirm').addEventListener('sg-activate', (event) => {
            document.querySelector('#result').textContent = `Received sg-activate from ${event.detail.source}.`;
        });
    </script>
</body>
</html>
